name: docs-sync

# Keeps docs/source/notebooks in step with examples/.
#
# readthedocs builds with nbsphinx_execute = "never", so the site renders
# whatever outputs are committed under docs/source/notebooks. That directory is
# a copy of examples/, refreshed by generate_docs.sh, and the two had already
# drifted. This runs the copy step on every push to main and, because main is a
# protected branch that rejects direct pushes ("Changes must be made through a
# pull request" -- the first live run failed exactly there), delivers the
# difference as a pull request on the docs-sync-bot branch.
#
# The full contract of the PR this opens -- triggers, rolling branch, stale
# cleanup, the checks nudge -- is documented for contributors in
# docs/source/notebook_pipeline.rst ("The sync PR").
#
# It copies; it does not execute. Notebook outputs come from a full-scale run
# committed alongside the notebook -- see .github/workflows/notebooks.yml for
# why CI cannot produce them itself.

on:
  push:
    branches: [main]
    paths:
      - "examples/**/*.ipynb"
      # The illustrations travel with the notebooks, so updating one without
      # touching its notebook must still re-sync.
      - "examples/**/*.png"
      # Destination changes must trigger too: a merged sync PR (or any PR that
      # edits the copies directly) produces a no-drift run whose job is to
      # close a now-stale docs-sync-bot PR. Without this, that PR would stay
      # open and mergeable, reintroducing files whose drift no longer exists.
      - "docs/source/notebooks/**"
      - "generate_docs.sh"
      - ".github/workflows/docs-sync.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync notebooks into docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # A token that can push back to the branch.
          persist-credentials: true

      - name: Copy notebooks into docs/source/notebooks
        run: |
          set -euo pipefail
          dest="docs/source/notebooks"
          mkdir -p "$dest"
          # Mirrors step 2 of generate_docs.sh. gpu_example.ipynb is excluded
          # from both the clean-out and the copy: it is kept exactly as
          # committed.
          find "$dest" -mindepth 1 -maxdepth 1 -type f -name "*.ipynb" \
              ! -name "gpu_example.ipynb" -exec rm -f {} +
          shopt -s nullglob
          for nb in examples/*/*.ipynb; do
              base="$(basename "$nb")"
              if [[ "$base" != tmp* && "$base" != plotting* && "$base" != gpu_example.ipynb ]]; then
                  cp "$nb" "$dest/"
              fi
          done
          # Notebooks reference their illustrations relatively, so the images have
          # to travel with them or the site renders a broken image. This is how
          # 5qubit-decoder.png came to be missing while shor-decoder.png was not.
          # Clean first, same as the notebooks above: a renamed or deleted
          # illustration must not linger in the destination.
          find "$dest" -mindepth 1 -maxdepth 1 -type f -name "*.png" -exec rm -f {} +
          for img in examples/*/*.png; do
              cp "$img" "$dest/"
          done

      - name: Deliver any drift as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then test the index: git diff on the worktree does not
          # see untracked files, so a newly added notebook would look like "no
          # change" and never be committed.
          git add docs/source/notebooks
          if git diff --cached --quiet -- docs/source/notebooks; then
              echo "docs/source/notebooks already matches examples/ -- nothing to do."
              # A bot PR opened for earlier drift is now stale: merging it would
              # reintroduce copies whose source has since been reverted or
              # synchronised another way. Close it rather than leave it mergeable.
              # No || true: an empty list already exits 0, so a failure here is
              # an auth/API error, and swallowing it would leave the stale PR
              # open while the job reports success.
              stale="$(gh pr list --head docs-sync-bot --state open --json number --jq '.[0].number')"
              if [ -n "$stale" ]; then
                  gh pr close "$stale" --comment "The drift this PR carried no longer exists; closing." --delete-branch
              fi
              exit 0
          fi
          git checkout -B docs-sync-bot
          git commit -m "docs: sync notebooks from examples/"
          git push -f origin docs-sync-bot
          # One rolling PR; force-pushing the branch updates it in place.
          if ! gh pr list --head docs-sync-bot --state open --json number --jq '.[0].number' | grep -q .; then
              gh pr create \
                  --head docs-sync-bot \
                  --title "docs: sync notebooks from examples/" \
                  --body "$(printf 'Automated sync of docs/source/notebooks from examples/, so readthedocs renders the outputs the notebooks were committed with.\n\nNote: pull requests opened with the default GITHUB_TOKEN do not trigger CI checks; close and reopen this PR (or push any commit to it) to run them before merging.')"
          fi
