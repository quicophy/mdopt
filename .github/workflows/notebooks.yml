name: notebooks

# Executes the example notebooks so that library changes cannot silently break
# them. Two breakages from #424 went unnoticed for ten months precisely because
# nothing ran these.
#
# MDOPT_NB_FAST=1 shrinks the workloads: at full scale maxbonddim and
# quantum_surface each take roughly 17 hours, far past the 6h GitHub caps a job
# at. The notebooks read that variable themselves. What is being tested is that
# they execute, not the numbers they produce -- the outputs are discarded, and
# the ones the documentation shows come from a full-scale run committed by hand.

on:
  push:
    branches: [main]
    paths:
      - "examples/**/*.ipynb"
      - "mdopt/**"
      - "scripts/run_notebooks.py"
      - ".github/workflows/notebooks.yml"
  pull_request:
    paths:
      - "examples/**/*.ipynb"
      - "mdopt/**"
      - "scripts/run_notebooks.py"
      - ".github/workflows/notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: execute notebooks (fast mode)
    runs-on: ubuntu-24.04
    # The suite is ~14 min on an M-series laptop; hosted runners are 2-3x
    # slower, so 28-42 min expected. 90 leaves room for a slow runner rather
    # than turning one into a red check.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Four notebooks set text.usetex, so matplotlib shells out to latex and
      # fails without these. cm-super and dvipng are what matplotlib's own
      # documentation asks for; type1cm and underscore live in latex-extra.
      - name: Install LaTeX for matplotlib's usetex
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            cm-super dvipng ghostscript

      - name: Set up Poetry
        run: pip install poetry

      # The dev group carries ipykernel, nbclient, nbformat and matplotlib.
      - name: Install package and notebook dependencies
        run: poetry install --with dev

      - name: Execute notebooks
        env:
          MDOPT_NB_FAST: "1"
          MPLBACKEND: Agg
        run: poetry run python scripts/run_notebooks.py
