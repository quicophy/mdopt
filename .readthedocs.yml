version: 2

build:
  os: ubuntu-24.04
  apt_packages:
    - pandoc
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

# Installs the project and its docs group straight from uv.lock, so the docs
# build uses the same pins as everything else and no exported requirements
# file has to be kept in the repository.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
