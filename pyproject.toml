[project]
name = "mdopt"
version = "2.0.0"
description = "Discrete optimisation in the tensor-network (specifically, MPS-MPO) language."
authors = [
    { name = "Aleksandr Berezutskii", email = "berezutskii.aleksandr@gmail.com" },
]
maintainers = [
    { name = "Aleksandr Berezutskii", email = "berezutskii.aleksandr@gmail.com" },
]
readme = "README.md"
keywords = [ "tensor networks", "quantum error correction", "discrete optimisation", "MPS", "MPO", "python", "decoding" ]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11,<4.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "scipy>=1.15.0,<2.0.0",
    "opt-einsum>=3.3.0,<4.0.0",
    "more-itertools>=8.12,<12.0",
    "threadpoolctl>=3.6.0,<4.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "qecstruct>=0.2.9,<0.3.0",
    "qecsim>=1.0b9,<2.0.0",
    "matrex>=0.0.1,<0.0.2",
    "numpy>=2.3.0,<2.5.0",
    "qldpc>=0.1.4,<0.4.0",
    "sympy>=1.14.0,<2.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "ldpc>=2.4.1,<3.0.0",
    "stim (>=1.16.0,<2.0.0)",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7,<0.17",
    "pylint>=4.0.8,<5.0.0",
    "setuptools>=84.0.0,<85.0",
    "mypy>=1.3,<3",
    "ipykernel>=7.3.0,<8",
    "notebook>=7.6.2,<8.0.0",
    "jupyter>=1.0.0,<2",
    "matplotlib>=3.11.1,<4",
    "pyinstrument>=5.1.1,<6",
]
test = [
    "coverage>=7.16.0,<8.0.0",
    "pytest-cov>=7.1.0,<8",
    "pytest>=9.1.1,<10.0",
    "py>=1.11.0,<2",
    "pymatching>=2.4.0,<3",
]
docs = [
    "matplotlib>=3.11.1,<4",
    "Sphinx>=8.2.3,<9.0.0",
    "myst-parser>=5.1.0,<6",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "nbsphinx>=0.9.2,<0.10",
    "pygments>=2.20.0,<3",
    "ipython>=9.17.1,<10",
    "pydata-sphinx-theme>=0.21.0,<0.22.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Poetry's groups were optional: a plain install brought only the runtime
# dependencies. Keep that: `uv sync` installs the package alone, and
# contributors ask for groups explicitly (`uv sync --group dev --group test`).
default-groups = []

[tool.uv.build-backend]
# Flat layout: the package lives at ./mdopt, not under src/.
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py311"
# Parity with black, which formatted Python files only: notebooks (whose
# outputs are regenerated and synced into the docs) and the Python blocks in
# Markdown files are left as they are.
extend-exclude = ["*.ipynb", "*.md"]
# Apply the excludes even to files named explicitly, as pre-commit does.
force-exclude = true
